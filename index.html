<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F5FD">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="나들이 지도">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>우리 가족 나들이 지도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 항공 우편과 바다: 하늘색 바탕, 짙은 바다색 버튼, 노을빛 코랄은 '다녀온 곳'에만 */
:root{
  --bg:#F7F5FD; --card:#FFFFFF; --ink:#1E2A30; --sub:#4C5470; --line:#E3DEF5; --line2:#CFC8EE;
  --navy:#0F4C75; --navy-d:#0A3655; --sea:#BFE0EE; --pale:#E3F1FB;
  --v1:#A6B1E1; --v2:#424874; --v2-t:#424874; --lav:#ECE8FB;
  --warm:#F2795B; --warm-d:#CF5A3E;
  --green:#2F6B2A; --green-bg:#E8F3E4; --note:#FFF6D9;
  --display:'Do Hyeon','IBM Plex Sans KR',sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;-webkit-tap-highlight-color:transparent}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy)}
:focus-visible{outline:3px solid #3282B8;outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:env(safe-area-inset-top) 0 calc(28px + env(safe-area-inset-bottom))}
.top{padding:16px 16px 10px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-family:var(--display);font-weight:400;color:#1E2A30;font-size:28px;letter-spacing:-.3px;line-height:1.15}
.eyebrow{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--navy)}
.ics{display:flex;gap:3px;color:#3282B8}
.titlerow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 4px}
.titlerow .s{font-size:15px;color:var(--sub)}
.back{align-self:flex-start;display:flex;align-items:center;gap:4px;height:48px;padding:0 16px 0 10px;border-radius:24px;background:#fff;border:1.5px solid var(--line);color:var(--ink);font-size:17px;font-weight:600;text-decoration:none}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ghost{height:44px;padding:0 14px;border-radius:22px;background:var(--pale);color:var(--navy);font-size:15px;font-weight:700;display:flex;align-items:center;text-decoration:none;border:none}
.pad{padding:0 16px}
.stack{display:flex;flex-direction:column;gap:8px}
.ticket{display:flex;background:#fff;border-radius:16px;box-shadow:0 2px 0 var(--line);overflow:hidden}
.ticket a{flex:1;padding:10px 12px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:var(--ink);min-width:0}
.ticket a+a{border-left:2px dashed var(--line2)}
.ticket .k{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.ticket .v{font-family:var(--display);font-size:26px;line-height:1;color:#1E2A30}
.ticket .v small{font-size:16px}
.mapbox{position:relative;margin:0 12px;border-radius:26px;background:var(--sea);overflow:hidden}
.mapbox.lnd{background:#C9E6F2}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.mapbox path[data-k]{cursor:pointer}
.land{fill:#fff;stroke:#A9CFE0;stroke-width:1.2;stroke-linejoin:round}
.v1{fill:var(--v1);stroke:#fff;stroke-width:1.2;stroke-linejoin:round}
.v2{fill:var(--v2);stroke:#fff;stroke-width:1.2;stroke-linejoin:round}
.dong{fill:#fff;stroke:#E3DEF5;stroke-width:.8;stroke-linejoin:round}
.dong.v1,.dong.v2{stroke:#fff}
.sel{fill:#BBE1FA !important;stroke:var(--navy) !important;stroke-width:1.6 !important}
.gu{fill:none;stroke:#7D84B8;stroke-width:1.6;stroke-linejoin:round;pointer-events:none}
.lb{font-family:var(--body);font-weight:700;fill:var(--ink);paint-order:stroke;stroke:rgba(255,255,255,.85);stroke-width:2.5px;stroke-linejoin:round;pointer-events:none}
.lb.m{font-weight:600;fill:#6A6F94}
.lb.w{fill:#fff;stroke:rgba(66,72,116,.9)}
.lb.c{font-weight:600}
.seal{font-family:var(--display);fill:#3F7FA6;pointer-events:none}
.legend{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 18px 0;font-size:14px;color:var(--ink);flex-wrap:wrap}
.legend .sw{display:flex;gap:12px}
.legend .sw span{display:flex;align-items:center;gap:5px}
.legend i{width:13px;height:13px;border-radius:3px;display:block}
.legend .h{font-weight:600;color:var(--navy)}
.cta{height:62px;border-radius:20px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:700;text-decoration:none;border:none;box-shadow:0 4px 0 var(--navy-d);width:100%}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy-d)}
.cta.coral{background:var(--warm);color:#fff;box-shadow:0 4px 0 var(--warm-d)}
.cta[disabled]{opacity:.45}
.linkrow{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 6px;text-decoration:none;color:var(--ink);font-size:16px}
.linkrow .k{color:var(--sub)}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:8px 12px 8px 8px;box-shadow:0 2px 0 var(--line);text-decoration:none;color:var(--ink);border:none;width:100%;text-align:left}
.row .t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.row .n{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .m{font-size:14px;color:var(--sub)}
.row .c{font-size:14px;font-weight:700;color:var(--v2-t);white-space:nowrap}
.tag{font-size:12px;font-weight:700;padding:2px 7px;border-radius:8px;white-space:nowrap}
.tag.관광지{background:var(--pale);color:var(--navy)}
.tag.차박{background:var(--green-bg);color:var(--green)}
.tag.기타{background:var(--lav);color:var(--v2)}
.pol{background:#fff;padding:4px 4px 10px;border-radius:4px;box-shadow:0 2px 6px rgba(27,58,92,.18);flex:none;position:relative}
.pol .ph{background:#C8DCE6;border-radius:2px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pol img{width:100%;height:100%;object-fit:cover;display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:40px;flex:none;padding:0 14px;border-radius:20px;background:#fff;color:var(--ink);border:1.5px solid var(--line);font-size:15px;font-weight:600}
.chip[aria-pressed="true"]{background:#1E2A30;color:#fff;border-color:#1E2A30}
.tabs{display:flex;gap:8px}
.tabs a{flex:1;height:52px;border-radius:16px;background:#fff;color:var(--ink);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-size:16px;font-weight:700;text-decoration:none}
.tabs a.on{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 3px 0 var(--navy-d)}
.tabs b{font-family:var(--display);font-weight:400;font-size:18px}
.mh{font-size:14px;font-weight:700;color:var(--navy);padding:8px 4px 0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cityb{height:60px;border-radius:18px;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 12px;text-decoration:none;color:var(--ink);font-size:17px;font-weight:700}
.cnt{min-width:38px;height:30px;padding:0 6px;border-radius:10px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}
.empty{background:#fff;border-radius:18px;padding:22px 18px;text-align:center;color:var(--sub);line-height:1.6;box-shadow:0 2px 0 var(--line)}
.post{background:#fff;border-radius:18px;box-shadow:0 3px 0 var(--line);overflow:hidden}
.post .in{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.post .d{font-family:var(--display);font-size:23px;color:#1E2A30;line-height:1.1}
.post p{margin:0;font-size:17px;line-height:1.6;white-space:pre-wrap}
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 2px}
.pgrid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px;padding:4px 2px}
.minibtn{height:40px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:15px;font-weight:600;color:var(--sub)}
.minibtn.warn{color:#A33A2E;border-color:#EFA396}
.minibtn.armed{background:#FFE1DB;color:#A33A2E;border-color:#EFA396}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lbl{font-size:17px;font-weight:700}
.inp{height:56px;border-radius:16px;border:1.5px solid var(--line2);background:#fff;padding:0 16px;font-size:18px;width:100%}
textarea.inp{height:auto;padding:14px 16px;line-height:1.5;resize:none}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{width:62px;height:62px;border-radius:14px;border:2px dashed var(--line2);background:transparent;flex:none}
.slot.add{border-color:var(--navy);background:#fff;color:var(--navy);font-size:30px;line-height:1}
.slotp{position:relative}
.slotp .x{position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:13px;border:2px solid #fff;background:var(--ink);color:#fff;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0}
.found{background:var(--pale);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.found .h{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:var(--navy)}
.found .w{font-size:20px;font-weight:700;line-height:1.4}
.found .w small{display:block;font-size:15px;font-weight:500;color:#33485C}
.btn2{display:flex;gap:8px;flex-wrap:wrap}
.btn2 button{flex:1 1 140px;height:52px;border-radius:16px;font-size:16px;font-weight:700;border:1.5px solid var(--navy);background:#fff;color:var(--navy)}
.btn2 button.p{background:var(--navy);color:#fff}
.seg{display:flex;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{display:flex;align-items:center;justify-content:center;gap:5px;flex:1;height:44px;border:none;border-radius:12px;background:transparent;font-size:16px;font-weight:700;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.picker{background:#fff;border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 0 var(--line)}
.picker .mapbox{margin:0}
.hint{font-size:14px;color:var(--sub);line-height:1.5}
.note{font-size:14px;color:var(--sub);background:var(--note);border-radius:12px;padding:10px 12px;line-height:1.5}
.sheet-bg{position:fixed;inset:0;background:rgba(27,42,56,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line2);align-self:center;margin-bottom:4px}
.viewer{position:fixed;inset:0;background:#0F1A24;z-index:30;display:flex;flex-direction:column}
.viewer .bar{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;color:#fff;font-size:16px}
.viewer .bar button{height:44px;padding:0 16px;border-radius:22px;border:none;background:rgba(255,255,255,.15);color:#fff;font-weight:700}
.viewer .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:pan-y}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .nav{display:flex;gap:10px;padding:10px 12px calc(14px + env(safe-area-inset-bottom))}
.viewer .nav button{flex:1;height:52px;border-radius:16px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:17px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;font-size:16px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.foot{display:flex;gap:8px;justify-content:center;padding:18px 16px 0;flex-wrap:wrap}
.hidden{display:none !important}
.busy{position:fixed;inset:0;z-index:35;background:rgba(241,247,250,.7);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--navy)}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="app" id="view"></div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileIn" accept="image/*" multiple class="hidden">
<input type="file" id="backupIn" accept="application/json,.json" class="hidden">
<script>
(function(){
'use strict';
const $ = s => document.querySelector(s);
const V = $('#view');
const esc = v => String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const DOW = ['일','월','화','수','목','금','토'];
const TYPES = ['관광지','차박','기타'];

const IC = {
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  chev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A6B1E1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  cam:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  pin:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  plane:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 13.5l19-8-5.5 15-3.5-6z"/><path d="M12.5 14.5l9-9"/></svg>',
  img:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18l5.5-6 4 4 3-3L21 18"/><circle cx="16.5" cy="7.5" r="2"/></svg>',
  mtn:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 19l6.5-10 4 6 2.5-3.5L22 19z"/><path d="M7 11.5l1.5 1.5 1.5-1.5"/></svg>',
  tent:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 19L12 5l9 14z"/><path d="M12 5v0M9.5 19L12 14l2.5 5"/><path d="M2 19h20"/></svg>',
  wave:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 10c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/><circle cx="18" cy="4.5" r="1.5"/></svg>',
  car:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15h18v3H3zM5 15l2-6h10l2 6M8 18v2M16 18v2"/></svg>',
  small:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A6B1E1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>'
};

// ---------------- IndexedDB ----------------
let idb;
function openIDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open('family-trip-map',1);
    r.onupgradeneeded = () => { const d=r.result; d.createObjectStore('meta'); d.createObjectStore('photos'); };
    r.onsuccess = () => { idb=r.result; res(); };
    r.onerror = () => rej(r.error);
  });
}
function tx(store, mode, fn){
  return new Promise((res,rej)=>{
    const t = idb.transaction(store, mode), s = t.objectStore(store);
    const out = fn(s);
    t.oncomplete = () => res(out && 'result' in out ? out.result : undefined);
    t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  });
}
const idbGet = (st,k) => tx(st,'readonly',s=>s.get(k));
const idbPut = (st,k,v) => tx(st,'readwrite',s=>s.put(v,k));
const idbDel = (st,k) => tx(st,'readwrite',s=>s.delete(k));
const idbClear = st => tx(st,'readwrite',s=>s.clear());
const idbKeys = st => tx(st,'readonly',s=>s.getAllKeys());

let DB = {places:[], visits:[]};
async function loadDB(){ const d = await idbGet('meta','db'); if(d){ DB=d; DB.places=DB.places||[]; DB.visits=DB.visits||[]; } }
async function saveDB(){ try{ await idbPut('meta','db',DB); }catch(e){ toast('저장하지 못했어요. 휴대폰 저장 공간을 확인해 주세요.'); throw e; } }

// 사진 URL 캐시
const urlCache = {};
async function photoURL(id, kind){
  const key = id+':'+kind;
  if(urlCache[key]) return urlCache[key];
  const rec = await idbGet('photos', id);
  if(!rec) return '';
  return urlCache[key] = URL.createObjectURL(kind==='full' ? rec.full : rec.thumb);
}
function hydrate(root){
  (root||document).querySelectorAll('img[data-ph]').forEach(async img=>{
    const u = await photoURL(img.dataset.ph, img.dataset.kind||'thumb');
    if(u) img.src = u;
  });
}

// ---------------- 지도 데이터 ----------------
const cache = {};
async function getJSON(p){
  if(cache[p]) return cache[p];
  const r = await fetch(p); if(!r.ok) throw new Error(p);
  return cache[p] = await r.json();
}
let KR, IDX;
const project = (f,lon,lat) => [lon*f.K*f.sc+f.ox, -lat*f.sc+f.oy];
function pathD(rings){
  let s='';
  for(const r of rings){ s+='M'+r[0]+' '+r[1]; for(let i=2;i<r.length;i+=2) s+='L'+r[i]+' '+r[i+1]; s+='Z'; }
  return s;
}
function pip(x,y,rings){
  let inside=false;
  for(const r of rings){
    for(let i=0,j=r.length-2;i<r.length;j=i,i+=2){
      const xi=r[i],yi=r[i+1],xj=r[j],yj=r[j+1];
      if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside;
    }
  }
  return inside;
}
const sidoInfo = id => KR.sido.find(s=>s.id===id) || {n:'',s:''};
const groupInfo = gk => KR.groups[gk] || {n:'',s:''};
function groupsOfSido(sid){ return Object.keys(KR.groups).filter(k=>KR.groups[k].s===sid); }

// GPS → 행정동
async function locate(lon, lat){
  if(!IDX) IDX = await getJSON('data/index.json');
  const k = Math.cos(lat*Math.PI/180);
  const near = IDX.map(e=>{ const dx=(e[2]-lon)*k, dy=e[3]-lat; return [dx*dx+dy*dy, e]; }).sort((a,b)=>a[0]-b[0]).slice(0,8);
  if(!near.length || near[0][0] > 0.25*0.25) return null; // 25km 이상 떨어지면 국내가 아님
  const gks = [...new Set(near.map(n=>n[1][4]))];
  for(const gk of gks){
    const g = await getJSON('data/sgg/'+gk+'.json');
    const [x,y] = project(g.fit, lon, lat);
    const hit = g.dongs.find(d=>pip(x,y,d.r));
    if(hit) return makeLoc(hit.c, hit.n, gk, lon, lat);
  }
  const e = near[0][1];
  return makeLoc(e[0], e[1], e[4], lon, lat);
}

  const g = groupInfo(gk), s = sidoInfo(g.s);
  return {code, name, gk, gname:g.n, sido:g.s, sidoName:s.n, sidoShort:s.s, lon, lat};
}

function fmtDate(iso, withDow){

// ---------------- 지도 SVG ----------------
// items: {k, rings, c(class), label, sub, size, show}
function svgMap(W, H, items, extra, labels){
  let s = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="지도">';
  for(const it of items) s += '<path data-k="'+esc(it.k)+'" class="'+it.c+'" d="'+pathD(it.rings)+'" fill-rule="evenodd"><title>'+esc(it.title||'')+'</title></path>';
  s += (extra||'') + (labels||'') + '</svg>';
  return s;
}
function textLabel(x,y,t,size,cl,sub){
  let s='<text class="lb '+(cl||'')+'" x="'+x+'" y="'+y+'" font-size="'+size+'" text-anchor="middle" dominant-baseline="middle">'+esc(t)+'</text>';
  if(sub) s+='<text class="lb '+(cl==='w'?'w':'')+'" x="'+x+'" y="'+(y+size*0.95)+'" font-size="'+Math.round(size*0.78)+'" text-anchor="middle" dominant-baseline="middle">'+esc(sub)+'</text>';
  return s;
}
const METRO = ['서울','인천','세종','대전','대구','울산','부산','광주'];
function koreaMap(counts, selId){
  const items = KR.sido.map(s=>({k:s.id, rings:s.r, c:(selId===s.id?'sel ':'')+(cls(counts[s.id])||'land'), title:s.n}));
  let ex = '<rect x="280" y="14" width="74" height="74" rx="12" fill="#D4EBF4" stroke="#8FB3C9" stroke-dasharray="4 4"/>'+
    '<path data-k="47" class="'+(cls(counts['47'])||'land')+'" d="'+pathD(KR.ul)+'"/>'+
    '<circle cx="341" cy="62" r="2.8" class="land"/><circle cx="335" cy="60.5" r="2.4" class="land"/>';
  let lb = '';
  KR.sido.forEach(s=>{
    const n=counts[s.id], m=METRO.includes(s.s);
    lb += textLabel(s.l[0], s.l[1]-(n?5:0), s.s==='제주'?'제주도':s.s, m?11:13, n>=3?'w':'', n?n+'곳':'');
  });
  lb += textLabel(306,64,'울릉도',9,'c') + textLabel(338,75,'독도',9,'c');
  lb += '<text class="seal" x="325" y="170" font-size="17" text-anchor="middle">동</text><text class="seal" x="325" y="210" font-size="17" text-anchor="middle">해</text>';
  lb += '<text class="seal" x="48" y="150" font-size="17" text-anchor="middle">서</text><text class="seal" x="48" y="190" font-size="17" text-anchor="middle">해</text>';
  lb += '<text class="seal" x="228" y="345" font-size="17" text-anchor="middle" letter-spacing="5">남 해</text>';
  return svgMap(KR.W, KR.H, items, ex, lb);
}
function sidoMap(sd, counts){
  const items = sd.groups.map(g=>({k:g.id, rings:g.r, c:cls(counts[g.id])||'land', title:g.n}));
  let ex = sd.ulInset ? '<rect x="310" y="40" width="50" height="70" rx="10" fill="#D4EBF4" stroke="#8FB3C9" stroke-dasharray="4 4"/>' : '';
  let lb = '';
  sd.groups.forEach(g=>{
    const n=counts[g.id];
    if(!n && g.a<600) return;
    lb += textLabel(g.l[0], g.l[1]-(n?4:0), g.n, n?12:10.5, n>=3?'w':n?'':'m', n?n+'곳':'');
  });
  // 인셋은 아이템보다 아래에 그려지면 가려지므로 rect를 먼저
  return svgMap(sd.W, sd.H, items, '', lb).replace('role="img" aria-label="지도">','role="img" aria-label="지도">'+ex);
}
function groupMap(g, counts, selCode){
  const items = g.dongs.map(d=>({k:d.c, rings:d.r, c:'dong '+(selCode===d.c?'sel ':'')+cls(counts[d.c]), title:d.n}));
  let ex = g.gus.map(u=>'<path class="gu" d="'+pathD(u.r)+'"/>').join('');
  const vd = g.dongs.filter(d=>counts[d.c]);
  let lb = g.gus.filter(u=>!vd.some(d=>Math.hypot(d.l[0]-u.l[0],d.l[1]-u.l[1])<26)).map(u=>textLabel(u.l[0],u.l[1],u.n,12,'m')).join('');
  g.dongs.forEach(d=>{ const n=counts[d.c]; if(n) lb += textLabel(d.l[0], d.l[1]-4, d.n, 12, n>=3?'w':'', n+'곳'); else if(selCode===d.c) lb += textLabel(d.l[0], d.l[1], d.n, 12, ''); });
  if(g.dokdo){
    ex += '<rect x="300" y="12" width="56" height="44" rx="10" fill="#D4EBF4" stroke="#8FB3C9" stroke-dasharray="4 4"/><circle cx="332" cy="30" r="3.2" class="land"/><circle cx="325" cy="28" r="2.8" class="land"/>';
    lb += textLabel(328,46,'독도',9,'c');
  }
  return svgMap(g.W, g.H, items, ex, lb);
}

  let sx=null; const st=el.querySelector('.stage');
  st.addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true});
  st.addEventListener('touchend',e=>{ if(sx==null) return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50){ i=(i+(dx<0?1:-1)+ids.length)%ids.length; show(); } sx=null; });
  el.querySelector('.nav').classList.toggle('hidden', ids.length<2);
  show();
}

// ---------------- 사진 정보(EXIF) 읽기 ----------------
async function readExif(file){
  try{
    const buf = await file.slice(0, 512*1024).arrayBuffer();
    const v = new DataView(buf);
    if(v.getUint16(0)!==0xFFD8) return {};
    let off=2;
    while(off < v.byteLength-4){
      const m=v.getUint16(off);
      if(m===0xFFE1 && v.getUint32(off+4)===0x45786966) return parseTiff(v, off+10);
      if((m & 0xFF00)!==0xFF00) break;
      off += 2 + v.getUint16(off+2);
    }
  }catch(e){}
  return {};
}
function parseTiff(v, t){
  const le = v.getUint16(t)===0x4949;
  const u16=o=>v.getUint16(o,le), u32=o=>v.getUint32(o,le);
  const str=(o,n)=>{ let s=''; for(let i=0;i<n;i++){ const c=v.getUint8(o+i); if(!c) break; s+=String.fromCharCode(c); } return s; };
  const entries=(ifd,cb)=>{ const n=u16(ifd); for(let i=0;i<n;i++){ const e=ifd+2+i*12; cb(u16(e), e, u32(e+4)); } };
  const res={}; let exifIFD=0, gpsIFD=0, dt0='';
  entries(t+u32(t+4),(tag,e,cnt)=>{
    if(tag===0x8769) exifIFD=t+u32(e+8);
    if(tag===0x8825) gpsIFD=t+u32(e+8);
    if(tag===0x0132) dt0=str(t+u32(e+8),cnt);
  });
  let dt='';
  if(exifIFD) entries(exifIFD,(tag,e,cnt)=>{ if(tag===0x9003) dt=str(t+u32(e+8),cnt); });
  dt = dt||dt0;
  const mm = /^(\d{4}):(\d{2}):(\d{2})/.exec(dt);
  if(mm && mm[1]!=='0000') res.date = mm[1]+'-'+mm[2]+'-'+mm[3];
  if(gpsIFD){
    const g={};
    entries(gpsIFD,(tag,e,cnt)=>{
      if(tag===1||tag===3) g[tag]=String.fromCharCode(v.getUint8(e+8));
      if(tag===2||tag===4){ const o=t+u32(e+8), r=[]; for(let i=0;i<3;i++){ const a=u32(o+i*8), b=u32(o+i*8+4); r.push(b?a/b:0); } g[tag]=r[0]+r[1]/60+r[2]/3600; }
    });
    if(g[2] && g[4]){ res.lat=g[2]*(g[1]==='S'?-1:1); res.lon=g[4]*(g[3]==='W'?-1:1); }
  }
  return res;
}

// ---------------- 사진 줄이기 ----------------
function loadImage(file){
  return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), img=new Image(); img.onload=()=>res({img,u}); img.onerror=()=>{ URL.revokeObjectURL(u); rej(new Error('img')); }; img.src=u; });
}
function toBlob(img, max, q){
  const s=Math.min(1, max/Math.max(img.naturalWidth, img.naturalHeight));
  const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',q));
}
async function shrink(file){
  const {img,u} = await loadImage(file);
  const full = await toBlob(img,1600,.82), thumb = await toBlob(img,420,.76);
  URL.revokeObjectURL(u);
  return {full, thumb};
}

function bindWrite(){
  V.oninput = e => {
    if(e.target.id==='wName') W.name=e.target.value;
    if(e.target.id==='wMemo') W.memo=e.target.value;
    if(e.target.id==='wDate'){ W.date=e.target.value; W.dateTouched=true; }
  };
  V.onclick = async e => {
    const t=e.target;
    const rm=t.closest('[data-rm]'); if(rm){ const ph=W.photos.splice(+rm.dataset.rm,1)[0]; if(ph.id) W.removed.push(ph.id); drawWrite(); return; }
    const a=t.closest('[data-a]');
    if(a){
      const act=a.dataset.a;
      if(act==='add') $('#fileIn').click();
      if(act==='here') useHere();
      if(act==='pick') openPicker('kr');
      if(act==='pclose'){ W.picker=null; drawWrite(); }
      if(act==='close'){ if(history.length>1) history.back(); else location.hash='#/'; }
      return;
    }
    const pb=t.closest('[data-pb]'); if(pb){ const [l,id]=pb.dataset.pb.split(':'); openPicker(l==='kr'?'kr':'sido',id); return; }
    const sel=t.closest('[data-sel]'); if(sel){ W.sel=sel.dataset.sel; drawWrite(); return; }
    const ty=t.closest('#wType button'); if(ty){ W.type=ty.dataset.t; V.querySelectorAll('#wType button').forEach(b=>b.setAttribute('aria-pressed',String(b===ty))); return; }
    const pk=t.closest('#pmap [data-k]');
    if(pk && W.picker){
      const k=pk.dataset.k, P=W.picker;
      if(P.lvl==='kr'){ const gs=groupsOfSido(k); if(gs.length===1) openPicker('g',gs[0]); else openPicker('sido',k); }
      else if(P.lvl==='sido') openPicker('g',k);
      else { const g=cache['data/sgg/'+P.id+'.json'], d=g.dongs.find(x=>x.c===k); const c=await dongCenter(d.c); W.loc=makeLoc(d.c,d.n,P.id,c[0],c[1]); W.locSrc='map'; W.sel=null; W.picker=null; drawWrite(); }
      return;
    }
    if(t.closest('#wSave')) saveWrite();
    if(t.closest('#wDel')){ if(!W.armed){ W.armed=true; drawWrite(); setTimeout(()=>{ if(W&&W.armed){ W.armed=false; if(location.hash.startsWith('#/write')) drawWrite(); } },4000); } else deleteVisit(); }
  };
}
function useHere(){
  if(!navigator.geolocation){ toast('이 휴대폰에서는 위치를 찾을 수 없어요'); return; }
  busy('지금 있는 곳을 찾는 중…');
  navigator.geolocation.getCurrentPosition(async pos=>{
    const l = await locate(pos.coords.longitude, pos.coords.latitude); busy();
    if(!l){ toast('국내 위치를 찾지 못했어요. 지도에서 골라 주세요'); return; }
    W.loc=l; W.locSrc='here'; W.sel=null; drawWrite();
  }, err=>{ busy(); toast(err.code===1?'위치 사용을 허용해 주세요. 지도에서 골라도 돼요':'위치를 찾지 못했어요. 지도에서 골라 주세요'); }, {enableHighAccuracy:true, timeout:15000, maximumAge:60000});
}
$('#fileIn').onchange = async e => {
  const files=[...e.target.files]; e.target.value='';
  if(!W || !files.length) return;
  const room=5-W.photos.length;
  if(files.length>room) toast('사진은 5장까지 넣을 수 있어요. 앞의 '+room+'장만 넣었어요');
  busy('사진을 정리하는 중…');
  let gps=null, date=null, bad=0;
  for(const f of files.slice(0,room)){
    const ex = await readExif(f);
    if(!gps && ex.lat!=null) gps=ex;
    if(!date && ex.date) date=ex.date;
    try{ const s=await shrink(f); W.photos.push({blob:s.full, thumb:s.thumb, url:URL.createObjectURL(s.thumb)}); }catch(x){ bad++; }
  }
  if(date && !W.dateTouched) W.date = date > todayISO() ? todayISO() : date;
  if(gps && !W.fixed && !W.loc){ const l=await locate(gps.lon, gps.lat); if(l){ W.loc=l; W.locSrc='photo'; W.sel=null; W.picker=null; } }
  busy(); drawWrite();
  if(bad) toast('열 수 없는 사진 '+bad+'장은 빼고 넣었어요');
  else if(!gps && !W.fixed && !W.loc) toast('사진에 위치 정보가 없어요. 장소를 골라 주세요');
};
async function saveWrite(){
  let pid=W.fixed;
  if(!pid){
    if(!W.loc){ toast('어디에 다녀왔는지 골라 주세요'); return; }
    const same=DB.places.filter(p=>p.dong===W.loc.code);
    if(W.sel && W.sel!=='new') pid=W.sel;
    else if(same.length && W.sel===null){ toast('장소를 고르거나 새 장소를 눌러 주세요'); return; }
    else {
      const n=W.name.trim(); if(!n){ toast('장소 이름을 적어 주세요'); $('#wName')&&$('#wName').focus(); return; }
      const L=W.loc;
      const p={id:uid(), name:n, type:W.type, dong:L.code, dongName:L.name, gk:L.gk, gname:L.gname, sido:L.sido, sidoName:L.sidoName, sidoShort:L.sidoShort, lon:L.lon, lat:L.lat, createdAt:Date.now()};
      DB.places.push(p); pid=p.id;
    }
  }
  if(!W.date){ toast('날짜를 골라 주세요'); return; }
  busy('저장하는 중…');
  try{
    const ids=[];
    for(const ph of W.photos){
      if(ph.id){ ids.push(ph.id); continue; }
      const id=uid(); await idbPut('photos', id, {full:ph.blob, thumb:ph.thumb}); ids.push(id);
    }
    for(const id of W.removed){ await idbDel('photos', id); }
    if(W.editId){ const v=DB.visits.find(x=>x.id===W.editId); v.date=W.date; v.memo=W.memo.trim(); v.photos=ids; }
    else DB.visits.push({id:uid(), placeId:pid, date:W.date, memo:W.memo.trim(), photos:ids, createdAt:Date.now()});
    await saveDB();
  }catch(x){ busy(); return; }
  busy(); W=null;
  location.replace('#/place/'+pid);
  toast('기록을 저장했어요');
}
async function deleteVisit(){
  const v=DB.visits.find(x=>x.id===W.editId); if(!v) return;
  for(const id of v.photos||[]) await idbDel('photos', id);
  DB.visits=DB.visits.filter(x=>x!==v);
  const p=placeById(v.placeId), left=DB.visits.some(x=>x.placeId===v.placeId);
  if(!left) DB.places=DB.places.filter(x=>x.id!==v.placeId);
  await saveDB(); W=null;
  location.replace(left?'#/place/'+v.placeId:'#/g/'+p.gk);
  toast('기록을 지웠어요');
}

// ---------------- 백업 ----------------
const blobToData = b => new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); });
async function exportBackup(){
  busy('백업 파일을 만드는 중…');
  try{
    const keys=await idbKeys('photos'), photos={};
    for(const k of keys){ const r=await idbGet('photos',k); photos[k]={full:await blobToData(r.full), thumb:await blobToData(r.thumb)}; }
    const blob=new Blob([JSON.stringify({app:'family-trip-map',v:1,savedAt:new Date().toISOString(),places:DB.places,visits:DB.visits,photos})],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='나들이지도-백업-'+todayISO()+'.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast('백업 파일을 저장했어요');
  }catch(e){ toast('백업 파일을 만들지 못했어요'); }
  busy();
}
$('#backupIn').onchange = e => {
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  const r=new FileReader();
  r.onload=async()=>{
    let d; try{ d=JSON.parse(r.result); if(d.app!=='family-trip-map') throw 0; }catch(x){ toast('나들이 지도 백업 파일이 아니에요'); return; }
    if(!confirm('지금 휴대폰에 있는 기록을 지우고 백업 파일의 기록('+(d.places||[]).length+'곳)으로 바꿀까요?')) return;
    busy('백업을 불러오는 중…');
    try{
      await idbClear('photos'); Object.keys(urlCache).forEach(k=>delete urlCache[k]);
      for(const [k,v] of Object.entries(d.photos||{})){ await idbPut('photos',k,{full:await (await fetch(v.full)).blob(), thumb:await (await fetch(v.thumb)).blob()}); }
      DB={places:d.places||[], visits:d.visits||[]}; await saveDB();
      toast('백업을 불러왔어요');
    }catch(x){ toast('백업을 불러오지 못했어요'); }
    busy(); location.hash='#/'; render();
  };
  r.readAsText(f);
};

// ---------------- 공통 ----------------
let tt;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('show'),2600); }
function busy(msg){ let b=$('#busy'); if(!msg){ if(b) b.remove(); return; } if(!b){ b=document.createElement('div'); b.id='busy'; b.className='busy'; document.body.appendChild(b); } b.textContent=msg; }

// ---------------- 길 찾기(라우터) ----------------
async function render(){
  const h=location.hash||'#/';
  const [path,qs]=h.slice(1).split('?');
  const q=Object.fromEntries(new URLSearchParams(qs||''));
  const seg=path.split('/').filter(Boolean);
  V.onclick=null; V.oninput=null;
  document.querySelectorAll('.sheet-bg,.viewer').forEach(x=>x.remove());
  try{
    if(!seg.length) renderHome();
    else if(seg[0]==='sido') await renderSido(seg[1]);
    else if(seg[0]==='g') await renderGroup(seg[1]);
    else if(seg[0]==='place') renderPlace(seg[1]);
    else if(seg[0]==='write'){ await initWrite(q); bindWrite(); await renderWrite(); }
    else if(seg[0]==='camp') renderCamp(seg[1]);
    else if(seg[0]==='list'){
      if(seg[1]==='visited') renderVisited();
      else if(seg[1]==='regions') renderRegions();
      else if(seg[1]==='photos') renderPhotos();
      else if(seg[1]==='region') renderRegionList(seg[2]);
    }
    else renderHome();
  }catch(e){
    console.error(e);
    V.innerHTML='<div class="top">'+backBtn('#/','전국 지도')+'<div class="empty">지도를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.</div></div>';
  }
  hydrate(V);
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);

(async function init(){
  try{ await openIDB(); await loadDB(); }
  catch(e){ V.innerHTML='<div class="top"><div class="empty">이 브라우저에서는 기록을 저장할 수 없어요. 사파리나 크롬으로 열어 주세요.</div></div>'; return; }
  try{ KR = await getJSON('data/korea.json'); }
  catch(e){ V.innerHTML='<div class="top"><div class="empty">지도를 불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.</div></div>'; return; }
  if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  render();
})();
})();

</script>
